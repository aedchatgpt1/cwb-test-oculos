const TAB={home:'Home',briefing:'Home',approve:'Inbox',sent:'Inbox',inbox:'Inbox',clients:'Clients',client:'Clients',maria:'Clients',visita:'Clients',area:'Clients',cam:'Clients',plan:'Clients',link:'Clients',resumo:'Clients',ok:'Clients',jobs:'Jobs',claude:'More',more:'More'};['gmail','agenda','drive','whatsapp','homedepot','amazon','thumbtack','social','conexoes','financas','sales','ponto','subs','precos','marketing','fornecedores','brain','refdocs','pendencias','jarbas'].forEach(k=>TAB[k]='More');
const TABS=['home','clients','jobs','inbox','more'],TABN=['Home','Clients','Jobs','Inbox','More'];
function sbar(){const e=$('#scr'),b=$('#app .sb'),m=$('#app .more');if(!e||!b)return;const r=e.clientHeight/e.scrollHeight;b.style.opacity=r<0.99?1:0;const h=Math.max(30,b.clientHeight*r);b.firstChild.style.height=h+'px';b.firstChild.style.top=((b.clientHeight-h)*(e.scrollTop/Math.max(1,e.scrollHeight-e.clientHeight)))+'px';m.style.opacity=e.scrollTop+e.clientHeight<e.scrollHeight-6?1:0}
function scrollBy(d){const e=$('#scr');e.scrollTop+=d;setTimeout(sbar,350)}
function L(){const sc=$('#scr');let a=sc?[...sc.querySelectorAll('.fx')]:[];if(sc&&!a.length&&sc.scrollHeight>sc.clientHeight+4)a=[sc];return [...a,...document.querySelectorAll('#vb .fx,#nb .fx')]}
function mark(){const sc0=$('#scr');if(sc0&&!L().includes(sc0))sc0.classList.remove('f');const nv=$('#nb .nav');if(nv){const c=L()[fi];nv.classList.toggle('cmp',!!(c&&c.closest('#scr')))}L().forEach((e,i)=>{e.classList.toggle('f',i===fi);if(i===fi&&e.id!=='scr'&&e.closest('#scr')&&e.scrollIntoView){const sc=e.closest('#scr'),fx=sc.querySelectorAll('.fx');if(e===fx[fx.length-1])sc.scrollTop=sc.scrollHeight;else e.scrollIntoView({block:'nearest',behavior:'smooth'})}});setTimeout(sbar,350)}
function arm(){try{if(scr!=='home'&&!(history.state&&history.state.lens))history.pushState({lens:1},'')}catch(e){}}
function go(s,keep){scr=s;arm();const el=$('#scr');el.style.animation='none';el.offsetHeight;el.style.animation='';el.innerHTML=V[s]();el.scrollTop=0;$('#vb').innerHTML=voice();$('#nb').innerHTML=nav(TAB[s]||'Home');sbar();if(!keep)fi=Math.max(0,L().findIndex(e=>e.dataset.a==='talk'));if(fi>=L().length)fi=0;mark();A.forEach(a=>a.justShot=false)}
function toast(t,s){const d=document.createElement('div');d.className='toast';d.innerHTML=`<div class="ic u">${I('msg')}</div><div class="tx"><div class="a">${t}</div><div class="s">${s}</div></div>`;$('#app').appendChild(d);setTimeout(()=>d.remove(),5200)}
const areaOf=t=>/banh|bath/.test(t)?2:/cozinh|kitch/.test(t)?1:/sala|living/.test(t)?0:null;
// Stand-in for Claude: on the real setup the words go to Claude Code on the Mac, which answers and picks the screen.
function claude(raw){const t=raw.toLowerCase();let a=areaOf(t);
 const H=hubIntent(t,raw);if(H)return H;
 if(/desce|rola|mais para baixo|pra baixo/.test(t)){setTimeout(()=>scrollBy(220),50);return['Desci a tela.',scr]}
 if(/sobe|para cima|pra cima/.test(t)){setTimeout(()=>scrollBy(-220),50);return['Subi a tela.',scr]}
 if(/jobs?\b/.test(t)&&!/job d/.test(t))return['2 jobs em andamento e 1 começando segunda.','jobs'];
 if(/job d/.test(t))return['João: 3 de 5 cômodos pintados, termina sexta. No teste isso é de exemplo.','jobs'];
 if(/briefing|bom dia|manh/.test(t))return['Bom dia, André. Visita às 10h no André Teste 2, 2 mensagens para aprovar e 3 novas de clientes.','briefing'];
 if(/aprovar|para aprovar/.test(t))return['A Maria pediu visita no sábado. Escrevi: "Saturday works, 9 AM". Posso mandar?','approve'];
 if(/pode mandar|manda|envia/.test(t)&&scr==='approve'){S.appr=Math.max(0,S.appr-1);S.msgs=Math.max(0,S.msgs-1);S.sent=true;return['Aprovada. No teste não saiu nada. Falta 1 mensagem para aprovar.','sent']}
 if(/muda|troca|edita/.test(t)&&scr==='approve')return['Mudei para 10h. Quer que eu mande?','approve'];
 if(/maria/.test(t))return['Hoje, há 12 minutos. Ela pediu visita no sábado, e o orçamento do deck ainda está sem resposta.','maria'];
 if(/jo[aã]o|paula/.test(t))return['Esse é só de exemplo no teste.',scr];
 if(/andr/.test(t))return['Abri o André Teste 2. Visita hoje às 10h; ele mandou 2 fotos.','client'];
 if(/clientes/.test(t))return['Seus clientes.','clients'];
 if(/inbox|mensagens|e-?mails/.test(t)&&!/aprovar/.test(t))return['3 mensagens e 5 e-mails. A da Maria é a mais nova.','inbox'];
 if(/documento de visita|abre a visita|abre o documento/.test(t))return[`Documento de visita aberto. ${pct()}% pronto; o banheiro ainda não tem scan.`,'visita'];
 if(/tinta|gal[aã]o|material/.test(t)){const x=A[a!==null?a:0];const sq=parseFloat(x.scan.par);const g=Math.ceil(sq*2/350);S.lastQ=raw;S.lastA=`${x.pt}: paredes ${x.scan.par} (do scan). Duas demãos = ${Math.round(sq*2)} sq ft. Rende uns 350 sq ft por galão, então <b style="color:#C9A84C">${g} galões</b>. Teto e rodapé à parte.`;return[`Para a ${x.pt}, ${g} galões, duas demãos, pelas paredes do scan.`,'claude']}
 if(/abre o claude|^claude/.test(t))return['Pode perguntar.','claude'];
 if(/desenh/.test(t))return['Desenhar sobre a foto abre no iPhone, com o dedo.',scr];
 if(/propost|mais op/.test(t))return['No teste isso fica de fora. Aqui o foco é a visita.',scr];
 if(/3d|modelo/.test(t)){if(a!==null)cur=a;if(cur===null)cur=1;return[`Abri o 3D da ${A[cur].pt} no seu iPhone. Aqui ficam as medidas.`,'link']}
 if(/salv|conclu|termin/.test(t)){S.saved=false;return['Confere o resumo e aprova com um toque ou dizendo "aprova".','ok']}
 if(/^aprova/.test(t)&&scr==='ok'){S.saved=true;return['Aprovado. No teste, nada foi salvo no CRM.','ok']}
 if(/falta|resumo/.test(t))return['Falta: '+A.map(x=>{const f=falta(x);return f.length?x.pt+' ('+f.join(', ')+')':null}).filter(Boolean).join('; ')+'.','resumo'];
 if(a!==null&&/abr|vai|mostr|ir |entra/.test(t)&&!/planta/.test(t)){cur=a;const x=A[a];return[x.scan?`${x.pt}: piso ${x.scan.piso}. ${x.pdok?'Tudo medido.':'Falta conferir a altura do teto.'}`:`${x.pt}: ainda sem scan.`,'area']}
 if(cur===null&&a===null)return['Qual área? Diga "abre a cozinha".',scr];
 if(a!==null)cur=a;const x=A[cur];
 if(/p[ée] direito|teto|altura/.test(t)){const m=t.match(/(\d+)\D+(\d+)/);if(m&&x.scan){x.scan.pd=`${m[1]}' ${m[2]}"`;x.pdok=true;x.notas.push(`Pé direito conferido: ${m[1]}' ${m[2]}"`);return[`Anotei ${m[1]}' ${m[2]}" na ${x.pt}. Bate com o scan.`,'area']}return['Qual a altura? Ex.: "pé direito 7 pés e 9".',scr]}
 const tg=TAGS.find(g=>t.includes(g.toLowerCase())||t.includes(g.toLowerCase().replace('ç','c').replace('ã','a')));
 if(tg&&/marc|tag|coloc/.test(t)){if(!x.tags.includes(tg))x.tags.push(tg);const rest=raw.replace(/^.*?(umidade|reparo|trocar|aten[cç][aã]o|upsell|ok)\s*/i,'');if(rest)x.notas.push(tg+': '+rest);return[`Marquei ${tg}${rest?' e anotei "'+rest+'"':''}. Quer uma foto disso?`,'area']}
 if(/foto/.test(t)){x.fotos.push('newk');x.justShot=true;return[`Foto ${x.fotos.length} salva na ${x.pt}, marcada com ${x.tags[0]||'a área'}.`,'cam']}
 if(/planta|scan/.test(t))return[x.scan?`Planta da ${x.pt} com as medidas de cada parede.`:`${x.pt} ainda não tem scan.`,'plan'];
 if(/anot|nota|escrev/.test(t)){const n=raw.replace(/^.*?(anota|anote|nota|escreve)\s*(que|a)?\s*/i,'');x.notas.push(n);return[`Anotado na ${x.pt}: "${n}".`,'area']}
 if(/volt|in[ií]cio|home/.test(t))return['Voltei ao início.','home'];
 return['Não entendi. Tente "anota ...", "tira uma foto" ou "o que falta?".',scr]}
function hubIntent(t,raw){
 if(/conect|conex/.test(t))return['Já ligados: CRM, Gmail, Agenda, Drive e Meta. WhatsApp, Home Depot e Amazon pelo Chrome no Mac.','conexoes'];
 if(/gmail|e-?mail da maria|nota da sherwin/.test(t)){if(/respond/.test(t)){S.pend={k:'GMAIL · RASCUNHO',t:'Salvar resposta para Maria?',b:'Hi Maria! May works. I can start the deck the first week of May. I\'ll confirm the date by Friday.<br><span style="color:#8fa1b6">Fica como rascunho no Gmail. Você manda.</span>',ok:()=>{S.gdraft=1;return['Rascunho salvo no Gmail (no teste, nada foi salvo).','gmail']}};return['Escrevi a resposta. Confere na lente.','gmail']}
  return['5 e-mails novos. A Maria pergunta se dá para começar o deck em maio.','gmail']}
 if(/agenda|calend|amanh/.test(t))return['Amanhã às 8 o deck da Ana. Sábado às 9 a Maria, se ela confirmar.','agenda'];
 if(/drive|docs?\b|planilha/.test(t)||(/proposta/.test(t)&&/acha|busca|procura/.test(t)))return['Achei a proposta do deck da Maria, editada há 6 dias. Abro no iPhone?','drive'];
 if(/proposta no iphone/.test(t))return['Abri a proposta no seu iPhone.','drive'];
 if(/whats|equipe|chego/.test(t)){if(/respond|chego/.test(t)){S.pend={k:'WHATSAPP · EQUIPE CWB',t:'Mandar para o grupo?',b:'Chego às 8 na Ana. Leva a escada grande.<br><span style="color:#8fa1b6">Sai pelo WhatsApp Web no seu Mac.</span>',ok:()=>{S.wa=1;return['Aprovado. No teste nada foi enviado.','whatsapp']}};return['Escrevi: "Chego às 8 na Ana". Aprova?','whatsapp']}
  return['3 mensagens no grupo da equipe. O Carlos pergunta a hora de amanhã.','whatsapp']}
